<!doctype html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="ie=edge">
     <title>Image Gallery</title>
     <link rel="stylesheet" href="style.css">
     <script type="module" src="js/is-land.js"></script>
     <script src="see-it.js" defer></script>
</head>
<body>
<nav>
<a href="index.html">Home </a>
<a href="image.html">Gallery </a>
<a href="guide.html">Guide</a>

</nav>
<svg width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="deutan"><feColorMatrix type="matrix"
    values="0.43 0.72 -.15 0 0  0.34 0.57 0.09 0 0  -.02 .03 1 0 0  0 0 0 1 0"/></filter>
</svg>

<fieldset class="experience-picker">
  <legend>Experience this as</legend>
  <label><input type="radio" name="sim" value="none" checked> Typical</label>
  <label><input type="radio" name="sim" value="low"> Low vision</label>
  <label><input type="radio" name="sim" value="cvd"> Red-green color blind</label>
  <label><input type="radio" name="sim" value="key"> Keyboard only</label>
  <p class="sim-note" id="sim-note" aria-live="polite" hidden>
    Mouse hidden. Try pressing Tab to move around.
  </p>
</fieldset>

<div data-sim-target>
  <h1>Image Gallery</h1>
  <h2>Welcome</h2>
<is-land on:visible>
<div id="gallery" v-scope="{ active: 'all' }">
  <div class="filters">
    <button @click="active = 'all'" :class="{ on: active === 'all' }" :aria-pressed="active === 'all'">All</button>
    <button @click="active = 'sketches'" :class="{ on: active === 'sketches' }" :aria-pressed="active === 'sketches'">AI</button>
    <button @click="active = 'photos'" :class="{ on: active === 'photos' }" :aria-pressed="active === 'photos'">Development</button>
    <button @click="active = 'type'" :class="{ on: active === 'type' }" :aria-pressed="active === 'type'">Ethic Principle</button>
  </div>
  <section class="topic" v-show="active === 'all' || active === 'sketches'">
    <h3>AI</h3>
    <img src="img/images.jpeg" alt="ai image">
  </section>
  <section class="topic" v-show="active === 'all' || active === 'photos'">
    <h3>Development</h3>
    <img src="img/development.jpeg" alt="Describe this image">
  </section>
  <section class="topic" v-show="active === 'all' || active === 'type'">
    <h3>Ethic Principle</h3>
    <img src="img/ai-ethics-principles.webp" alt="Describe this image">
  </section>
</div>
  <template data-island>
    <script type="module">
      import { createApp } from './js/petite-vue.js'
      createApp().mount('#gallery')
    </script>
  </template>
</is-land>

  <footer>
    <p>Page last updated: 11/12/2026</p>
  </footer>
</div>
</body>
</html>
